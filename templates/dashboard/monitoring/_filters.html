<div class="rounded-[1.75rem] border border-slate-200 bg-white p-5 shadow-sm">
  <form method="get" class="flex flex-col gap-5 xl:flex-row xl:items-end xl:justify-between">
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-5">
      <label class="block">
        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-500">Period</span>
        <select name="period" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
          {% for option in monitoring_bundle.filters.period_options %}
            <option value="{{ option.value }}"{% if monitoring_bundle.filters.period == option.value %} selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="block">
        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-500">Start</span>
        <input type="date" name="start" value="{{ monitoring_bundle.filters.start }}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
      </label>
      <label class="block">
        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-500">End</span>
        <input type="date" name="end" value="{{ monitoring_bundle.filters.end }}" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
      </label>
      <label class="block">
        <span class="mb-2 block text-xs font-semibold uppercase tracking-[0.22em] text-slate-500">Source</span>
        <select name="source" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
          {% for option in source_options %}
            <option value="{{ option.value }}"{% if selected_source == option.value %} selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
        <input type="checkbox" name="compare" value="1"{% if monitoring_bundle.filters.compare %} checked{% endif %} class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
        <span class="text-sm font-medium text-slate-700">Compare period</span>
      </label>
    </div>
    <div class="flex flex-wrap gap-3">
      <button type="submit" class="inline-flex items-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-600/20 hover:bg-blue-700">Refresh</button>
      <a href="{{ monitoring_export_urls.csv }}" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-950">CSV</a>
      <a href="{{ monitoring_export_urls.xlsx }}" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-950">Excel</a>
      <a href="{{ monitoring_export_urls.pdf }}" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:border-slate-300 hover:text-slate-950">PDF</a>
    </div>
  </form>
  <div class="mt-4 text-sm text-slate-500">
    <span class="font-medium text-slate-700">{{ monitoring_bundle.filters.label }}</span>
    <span class="ml-2">Viewing {{ selected_source_label|lower }}.</span>
  </div>
</div>
