{% if messages %}
    <div class="messages-container space-y-3 mb-6">
        {% for message in messages %}
            <div class="message-alert rounded-lg p-4 border-l-4 shadow-sm transition-all duration-300 ease-in-out
                {% if message.tags == 'error' or message.tags == 'danger' %}
                    bg-red-50 border-red-400 text-red-800
                {% elif message.tags == 'warning' %}
                    bg-yellow-50 border-yellow-400 text-yellow-800
                {% elif message.tags == 'success' %}
                    bg-green-50 border-green-400 text-green-800
                {% elif message.tags == 'info' %}
                    bg-blue-50 border-blue-400 text-blue-800
                {% else %}
                    bg-gray-50 border-gray-400 text-gray-800
                {% endif %}
                " data-message-type="{{ message.tags }}">
                
                <div class="flex items-start">
                    <!-- Icon -->
                    <div class="flex-shrink-0 mr-3">
                        {% if message.tags == 'error' or message.tags == 'danger' %}
                            <svg class="w-5 h-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                            </svg>
                        {% elif message.tags == 'warning' %}
                            <svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                            </svg>
                        {% elif message.tags == 'success' %}
                            <svg class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                            </svg>
                        {% elif message.tags == 'info' %}
                            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                        {% else %}
                            <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                        {% endif %}
                    </div>
                    
                    <!-- Message Content -->
                    <div class="flex-1">
                        <div class="message-content">
                            {{ message|safe }}
                        </div>
                    </div>
                    
                    <!-- Close Button -->
                    <div class="flex-shrink-0 ml-4">
                        <button type="button" class="message-close inline-flex rounded-md p-1.5 focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors duration-200
                            {% if message.tags == 'error' or message.tags == 'danger' %}
                                text-red-500 hover:bg-red-100 focus:ring-red-500
                            {% elif message.tags == 'warning' %}
                                text-yellow-500 hover:bg-yellow-100 focus:ring-yellow-500
                            {% elif message.tags == 'success' %}
                                text-green-500 hover:bg-green-100 focus:ring-green-500
                            {% elif message.tags == 'info' %}
                                text-blue-500 hover:bg-blue-100 focus:ring-blue-500
                            {% else %}
                                text-gray-500 hover:bg-gray-100 focus:ring-gray-500
                            {% endif %}
                            " onclick="closeMessage(this)">
                            <span class="sr-only">Dismiss</span>
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

    <!-- JavaScript for message functionality -->
    <script>
        // Auto-hide messages after 5 seconds (except errors)
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.message-alert');
            
            messages.forEach(function(message) {
                const messageType = message.getAttribute('data-message-type');
                
                // Don't auto-hide error messages
                if (messageType !== 'error' && messageType !== 'danger') {
                    setTimeout(function() {
                        fadeOutMessage(message);
                    }, 5000);
                }
            });
        });

        // Function to close message manually
        function closeMessage(button) {
            const message = button.closest('.message-alert');
            fadeOutMessage(message);
        }

        // Function to fade out and remove message
        function fadeOutMessage(message) {
            message.style.transition = 'opacity 0.3s ease-out, transform 0.3s ease-out';
            message.style.opacity = '0';
            message.style.transform = 'translateY(-10px)';
            
            setTimeout(function() {
                message.remove();
                
                // Remove container if no messages left
                const container = document.querySelector('.messages-container');
                if (container && container.children.length === 0) {
                    container.remove();
                }
            }, 300);
        }

        // Add slide-in animation for new messages
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.message-alert');
            
            messages.forEach(function(message, index) {
                message.style.opacity = '0';
                message.style.transform = 'translateY(-20px)';
                
                setTimeout(function() {
                    message.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                    message.style.opacity = '1';
                    message.style.transform = 'translateY(0)';
                }, index * 100); // Stagger animation
            });
        });
    </script>

    <!-- Additional CSS for enhanced styling -->
    <style>
        .message-alert {
            position: relative;
            overflow: hidden;
        }

        .message-alert::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0.3;
        }

        .message-content a {
            text-decoration: underline;
            font-weight: 600;
        }

        .message-content a:hover {
            opacity: 0.8;
        }

        /* Pulse animation for error messages */
        .message-alert[data-message-type="error"],
        .message-alert[data-message-type="danger"] {
            animation: pulse-error 2s infinite;
        }

        @keyframes pulse-error {
            0%, 100% { 
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }
            50% { 
                box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
            }
        }

        /* Success message celebration effect */
        .message-alert[data-message-type="success"] {
            position: relative;
        }

        .message-alert[data-message-type="success"]::after {
            content: '🎉';
            position: absolute;
            top: 10px;
            right: 50px;
            font-size: 16px;
            animation: celebrate 0.6s ease-out;
        }

        @keyframes celebrate {
            0% { 
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% { 
                transform: scale(1.2) rotate(180deg);
                opacity: 1;
            }
            100% { 
                transform: scale(1) rotate(360deg);
                opacity: 0.8;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .message-alert {
                margin-left: -1rem;
                margin-right: -1rem;
                border-radius: 0;
                border-left: none;
                border-top: 4px solid;
            }
            
            .message-alert::before {
                height: 0;
            }
        }
    </style>
{% endif %}
