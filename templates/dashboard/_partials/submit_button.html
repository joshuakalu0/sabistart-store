<div id='floating_submit_button'
    class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl border border-slate-200/90 dark:border-slate-700 p-3 sm:p-4 md:p-6 flex flex-row justify-end items-center gap-2 sm:gap-4 shadow-lg mb-8 sticky bottom-20 lg:bottom-4 z-20">
    <button type="button" id="floating_reset_button"
        class="flex-1 sm:flex-initial px-4 sm:px-8 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium text-xs sm:text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-center">Reset</button>
    <button type="submit" id="floating_submit_button"
        class="flex-1 sm:flex-initial px-5 sm:px-8 py-2.5 rounded-xl bg-primary text-white font-medium text-xs sm:text-sm shadow-lg shadow-primary/20 hover:bg-blue-600 transition-all flex items-center justify-center">
        <span class="material-icons-outlined mr-1.5 sm:mr-2 text-[18px]">save</span>
        <span>Save information</span>
    </button>
</div>


<script>
    const button = document.getElementById('buttom_submit');
    const reset_button = document.getElementById('floating_reset_button');
    const submit_button = document.getElementById('floating_submit_button');
    const form = document.getElementById('form');

    reset_button.addEventListener('click', function () {
        form.reset();
    });

    submit_button.addEventListener('click', function () {
        form.submit();
    });

    const options = {
        root: null, // null means the top-level document viewport
        rootMargin: '0px',
        threshold: 0.1 // 10% of the target element must be visible
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const floating_submit_button = document.getElementById('floating_submit_button')
                floating_submit_button.classList.add('hidden')
            } else {
                const floating_submit_button = document.getElementById('floating_submit_button')
                floating_submit_button.classList.remove('hidden')
            }
        });
    }, options);

    observer.observe(button);


</script>
