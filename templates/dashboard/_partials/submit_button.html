<div id='floating_submit_button'
    class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 flex justify-end items-center space-x-4 shadow-sm mb-12 sticky bottom-0 z-20">
    <button type="button" id="floating_reset_button"
        class="px-8 py-2.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Reset</button>
    <button type="submit" id="floating_submit_button"
        class="px-8 py-2.5 rounded-lg bg-primary text-white font-medium shadow-lg shadow-primary/20 hover:bg-blue-600 transition-all flex items-center">
        <span class="material-icons-outlined mr-2 text-[18px]">save</span>
        Save information
    </button>
</div>


<script>
    const button = document.getElementById('buttom_submit');
    const reset_button = document.getElementById('floating_reset_button');
    const submit_button = document.getElementById('floating_submit_button');
    const form = document.getElementById('form');

    reset_button.addEventListener('click', function () {
        form.reset();
    });

    submit_button.addEventListener('click', function () {
        form.submit();
    });

    const options = {
        root: null, // null means the top-level document viewport
        rootMargin: '0px',
        threshold: 0.1 // 10% of the target element must be visible
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const floating_submit_button = document.getElementById('floating_submit_button')
                floating_submit_button.classList.add('hidden')
            } else {
                const floating_submit_button = document.getElementById('floating_submit_button')
                floating_submit_button.classList.remove('hidden')
            }
        });
    }, options);

    observer.observe(button);


</script>
