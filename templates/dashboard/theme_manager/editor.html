{% extends "dashboard/_partials/base.html" %}
{% block content %}
  <section class="space-y-6">
    <div class="rounded-[2rem] bg-white p-8 shadow-sm ring-1 ring-slate-200">
      <p class="text-xs font-semibold uppercase tracking-[0.28em] text-blue-600">Theme Editor</p>
      <h1 class="mt-3 text-3xl font-extrabold text-slate-950">{{ page.page_name }}</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">Edit the installed copy for this tenant. HTML and CSS changes are saved directly to the tenant theme workspace.</p>
    </div>
    <form method="post" class="grid gap-6 xl:grid-cols-2">
      {% csrf_token %}
      <div class="rounded-[2rem] bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <label class="block text-sm font-semibold text-slate-700">HTML</label>
        <textarea name="html_content" rows="28" class="mt-3 w-full rounded-2xl border-slate-200 font-mono text-sm">{{ html_content }}</textarea>
      </div>
      <div class="rounded-[2rem] bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <label class="block text-sm font-semibold text-slate-700">CSS</label>
        <textarea name="css_content" rows="28" class="mt-3 w-full rounded-2xl border-slate-200 font-mono text-sm">{{ css_content }}</textarea>
      </div>
      <div class="xl:col-span-2 flex flex-wrap gap-3">
        <button type="submit" class="rounded-2xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white">Save changes</button>
        <a href="{% url 'dashboard:themes:preview' prefix=prefix shop_theme_id=shop_theme.id page_name=page.page_name %}" target="_blank" class="rounded-2xl bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-700">Open preview</a>
      </div>
    </form>
  </section>
{% endblock %}
