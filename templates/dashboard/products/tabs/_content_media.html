<h3 class="text-xl font-bold mb-6 flex items-center gap-2">
  <span class="material-symbols-outlined text-primary">perm_media</span>
  Content & Media
</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div class="col-span-2">
    <label class="block text-sm font-semibold mb-2">Short Description</label>
    {{ form.short_description }} {% if form.short_description.errors %}<span
      class="text-red-500 text-sm"
      >{{ form.short_description.errors.0 }}</span
    >{% endif %}
  </div>
  <div class="col-span-2">
    <label class="block text-sm font-semibold mb-2">Description</label>
    {{ form.description }} {% if form.description.errors %}<span
      class="text-red-500 text-sm"
      >{{ form.description.errors.0 }}</span
    >{% endif %}
  </div>
  <div class="col-span-2">
    <label class="block text-sm font-semibold mb-2">Product Images</label>
    <!-- Image upload functionality would go here -->
    <div
      class="flex flex-wrap gap-2 p-3 bg-slate-50 dark:bg-slate-800/50 border border-dashed border-slate-300 dark:border-slate-700 rounded-lg"
    >
      <button
        type="button"
        class="text-xs text-slate-400 font-medium hover:text-primary"
      >
        + Add Image
      </button>
    </div>
  </div>
</div>
