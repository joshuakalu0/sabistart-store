<script>
    console.log('util')
  // Utility Functions
  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : ((r & 0x3) | 0x8);
      return v.toString(16);
    });
  }

  function updateCategoriesInput() {
    const categoriesInput = document.getElementById('categoriesInput');
    const selectedCategories = document.querySelectorAll('.selected-category');
    const categoryIds = Array.from(selectedCategories).map(el => el.getAttribute('data-id'));
    categoriesInput.value = JSON.stringify(categoryIds);
  }

  function updateTagsInput() {
    const tagsInput = document.getElementById('tagsInput');
    const selectedTags = document.querySelectorAll('.selected-tag');
    const tagNames = Array.from(selectedTags).map(el => el.getAttribute('data-name'));
    tagsInput.value = JSON.stringify(tagNames);
  }

  // Categories Management
  function addExistingCategory(categoryId, categoryName) {
    if (!selectedCategories.find(cat => cat.id === categoryId)) {
      selectedCategories.push({
        id: categoryId,
        name: categoryName
      });
      renderSelectedCategories();
    }
  }

  function removeCategory(categoryId) {
    selectedCategories = selectedCategories.filter(cat => cat.id !== categoryId);
    renderSelectedCategories();
  }

  function renderSelectedCategories() {
    const container = document.getElementById('selectedCategories');
    container.innerHTML = Array.from(selectedCategories).map(category => `
          <div class="selected-item bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm inline-block mr-2 mb-2">
              ${category.name}
              <button type="button" onclick="removeCategory(${category.id})" class="ml-2 text-blue-600 hover:text-blue-800">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>
      `).join('');
  }

  // Tags Management
  function addExistingTag(tagName) {
    if (!selectedTags.find(tag => tag === tagName)) {
      selectedTags.push(tagName);
      renderSelectedTags();
    }
  }

  function removeTag(tagName) {
    selectedTags = selectedTags.filter(tag => tag !== tagName);
    renderSelectedTags();
  }

  function renderSelectedTags() {
    const container = document.getElementById('selectedTags');
    container.innerHTML = Array.from(selectedTags).map(tag => `
          <div class="selected-item bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm inline-block mr-2 mb-2">
              ${tag}
              <button type="button" onclick="removeTag('${tag}')" class="ml-2 text-green-600 hover:text-green-800">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
              </button>
          </div>
      `).join('');
  }


</script>
