<script>
  console.log('media')
  // Media Management
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  function handleDragOver(event) {
    event.preventDefault();
    document.getElementById('imageUploadArea').classList.add('drag-over');
  }

  function handleDragLeave(event) {
    event.preventDefault();
    document.getElementById('imageUploadArea').classList.remove('drag-over');
  }

  function handleDrop(event) {
    event.preventDefault();
    document.getElementById('imageUploadArea').classList.remove('drag-over');
    const files = Array.from(event.dataTransfer.files).filter(file => file.type.startsWith('image/'));
    handleFiles(files);
  }

  function handleImageUpload(event) {
    const files = Array.from(event.target.files);
    handleFiles(files);
  }

  function handleFiles(files) {
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imgElement = document.createElement('div');
        imgElement.className = 'image-preview relative group rounded-lg overflow-hidden border border-gray-200';
        imgElement.innerHTML = `
          <img src="${e.target.result}" alt="${file.name}" class="w-full h-32 object-cover">
          <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-40 transition-all flex items-center justify-center space-x-2 opacity-0 group-hover:opacity-100">
            <button type="button" onclick="setPrimaryImage(this)" class="p-2 bg-white rounded-full hover:bg-gray-100" title="Set as Primary">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </button>
            <button type="button" onclick="removeImage(this)" class="p-2 bg-white rounded-full hover:bg-gray-100" title="Remove">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        `;
        document.getElementById('imagePreviewContainer').appendChild(imgElement);

        // Create hidden input for form submission
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'images';
        hiddenInput.value = e.target.result;
        document.getElementById('productForm').appendChild(hiddenInput);
      };
      reader.readAsDataURL(file);
    });
  }

  function setPrimaryImage(button) {
    const allImages = document.querySelectorAll('#imagePreviewContainer .image-preview');
    allImages.forEach(img => img.querySelector('span')?.remove());

    const imgElement = button.closest('.image-preview');
    const primaryBadge = document.createElement('span');
    primaryBadge.className = 'absolute top-2 left-2 px-2 py-1 bg-primary-600 text-white text-xs rounded';
    primaryBadge.textContent = 'Primary';
    imgElement.prepend(primaryBadge);
  }

  function removeImage(button) {
    const imgElement = button.closest('.image-preview');
    const imgSrc = imgElement.querySelector('img').src;

    imgElement.remove();

    // Remove hidden input
    const hiddenInputs = document.querySelectorAll('#productForm input[type="hidden"][name="images"]');
    hiddenInputs.forEach(input => {
      if (input.value === imgSrc) {
        input.remove();
      }
    });
  }
</script>
