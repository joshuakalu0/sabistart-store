{% extends \x27dashboard/base.html\x27 %}
{% load static %}

{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="bg-white rounded-xl border border-[#EEF2F6] shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-[#EEF2F6]">
            <h2 class="text-lg font-semibold text-slate-800">{{ page_title }}</h2>
            <p class="text-xs text-slate-500 mt-0.5">{{ page_description }}</p>
        </div>
        <div class="p-6">
            {{ form }}
        </div>
    </div>
</form>
{% endblock %}
