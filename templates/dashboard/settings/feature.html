{% extends \x27dashboard/base.html\x27 %}
{% load static %}

{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700">
            <h2 class="text-lg font-semibold text-slate-800 dark:text-white">{{ page_title }}</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ page_description }}</p>
        </div>
        <div class="p-6">
            {{ form }}
        </div>
    </div>
</form>
{% endblock %}
