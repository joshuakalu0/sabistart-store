<div class="mb-8 flex flex-wrap gap-3">
  {% for item in theme_navigation %}
    <a
      href="{{ item.url }}"
      class="inline-flex items-center rounded-full px-4 py-2 text-sm font-semibold {% if item.active %}bg-slate-950 text-white{% else %}bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50{% endif %}"
    >
      {{ item.label }}
    </a>
  {% endfor %}
</div>
