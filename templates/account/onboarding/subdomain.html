{% extends "account/_auth_base.html" %}
{% block auth_content %}
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-blue-600">Step 4 of 5</p>
    <h1 class="mt-3 text-3xl font-extrabold text-slate-950">Reserve your store subdomain</h1>
  </div>
  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    {% include "shared/forms/field.html" with field=form.desired_subdomain %}
    <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-500">
      Your public store address will be <span class="font-semibold text-slate-900">your-store.{{ platform_domain_suffix }}</span>.
    </div>
    <div id="subdomain-status" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-500 hidden"></div>
    <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-700">Continue to launch review</button>
  </form>
  <script>
    (function () {
      const input = document.getElementById("id_desired_subdomain");
      const statusBox = document.getElementById("subdomain-status");
      if (!input || !statusBox) return;

      let timer = null;
      const setState = (message, kind) => {
        statusBox.classList.remove("hidden", "border-emerald-200", "bg-emerald-50", "text-emerald-700", "border-rose-200", "bg-rose-50", "text-rose-700", "border-slate-200", "bg-slate-50", "text-slate-500");
        if (kind === "success") {
          statusBox.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-700");
        } else if (kind === "error") {
          statusBox.classList.add("border-rose-200", "bg-rose-50", "text-rose-700");
        } else {
          statusBox.classList.add("border-slate-200", "bg-slate-50", "text-slate-500");
        }
        statusBox.textContent = message;
      };

      input.addEventListener("input", function () {
        const value = this.value.trim();
        clearTimeout(timer);
        if (!value) {
          statusBox.classList.add("hidden");
          return;
        }
        setState("Checking availability...", "neutral");
        timer = setTimeout(function () {
          fetch("{% url 'platform:check_subdomain' %}?subdomain=" + encodeURIComponent(value))
            .then(async (response) => {
              const payload = await response.json();
              return { ok: response.ok, payload };
            })
            .then(({ ok, payload }) => {
              setState(payload.message || "Unable to validate subdomain right now.", ok && payload.available ? "success" : "error");
            })
            .catch(() => {
              setState("Unable to validate subdomain right now.", "error");
            });
        }, 300);
      });
    }());
  </script>
{% endblock %}
