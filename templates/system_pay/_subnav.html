<div class="mb-6 flex flex-wrap gap-2">
  {% for item in payment_navigation %}
    <a href="{{ item.url }}" class="rounded-2xl px-4 py-2 text-sm font-semibold {% if item.active %}bg-slate-900 text-white{% else %}border border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:text-slate-950{% endif %}">
      {{ item.label }}
    </a>
  {% endfor %}
</div>
