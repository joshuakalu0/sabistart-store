services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sabistore
      POSTGRES_PASSWORD: sabistore
      POSTGRES_DB: sabistore
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "until python manage.py check --database default; do echo 'Waiting for database...'; sleep 1; done;
             python manage.py migrate;
             python manage.py collectstatic --noinput;
             gunicorn sabistart_store.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgres://sabistore:sabistore@db:5432/sabistore
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost http://127.0.0.1
    depends_on:
      - db

volumes:
  postgres_data: