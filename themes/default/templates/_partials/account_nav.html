<aside class="surface-card h-fit overflow-hidden p-5">
    <div class="surface-card-soft p-4">
        <p class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">Customer Area</p>
        <h2 class="brand-font mt-2 text-2xl font-bold text-slate-950">{{ request.user.get_full_name|default:request.user.email|default:"My Account" }}</h2>
        <p class="mt-2 text-sm leading-6 text-slate-500">Manage your orders, account details, saved preferences, and post-purchase tools.</p>
    </div>
    <nav class="mt-5 space-y-2">
        {% for item in account_navigation %}
            <a href="{{ item.url }}" class="flex items-center justify-between rounded-2xl px-4 py-3 text-sm font-semibold transition {% if request.path == item.url %}bg-slate-950 text-white{% else %}text-slate-700 hover:bg-slate-50{% endif %}">
                <span>{{ item.label }}</span>
                <span class="material-symbols-outlined !text-base {% if request.path == item.url %}text-white{% else %}text-slate-400{% endif %}">chevron_right</span>
            </a>
        {% endfor %}
    </nav>
</aside>
