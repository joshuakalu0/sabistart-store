<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Nara Merchant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-container": "#98805d",
              "primary-container": "#131b2e",
              "on-primary-container": "#7c839b",
              "on-secondary-fixed": "#341100",
              "tertiary-fixed": "#fcdeb5",
              "surface-container-low": "#f3f3f3",
              "on-primary": "#ffffff",
              "surface-variant": "#e2e2e2",
              "surface-tint": "#565e74",
              "on-primary-fixed": "#131b2e",
              "inverse-primary": "#bec6e0",
              "surface-bright": "#f9f9f9",
              "primary-fixed-dim": "#bec6e0",
              "on-tertiary-fixed-variant": "#574425",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f0f1f1",
              "tertiary-container": "#271901",
              "surface-container-highest": "#e2e2e2",
              "on-error": "#ffffff",
              "inverse-surface": "#2f3131",
              "background": "#f9f9f9",
              "surface-dim": "#dadada",
              "secondary-fixed-dim": "#ffb690",
              "outline-variant": "#c6c6cd",
              "surface-container": "#eeeeee",
              "on-primary-fixed-variant": "#3f465c",
              "surface-container-high": "#e8e8e8",
              "error": "#ba1a1a",
              "on-background": "#1a1c1c",
              "outline": "#76777d",
              "on-secondary-container": "#5c2400",
              "error-container": "#ffdad6",
              "primary": "#000000",
              "on-secondary-fixed-variant": "#783200",
              "on-secondary": "#ffffff",
              "surface": "#f9f9f9",
              "secondary-container": "#fd761a",
              "on-surface-variant": "#45464d",
              "tertiary-fixed-dim": "#dec29a",
              "secondary-fixed": "#ffdbca",
              "surface-container-lowest": "#ffffff",
              "secondary": "#9d4300",
              "on-error-container": "#93000a",
              "primary-fixed": "#dae2fd",
              "on-surface": "#1a1c1c",
              "tertiary": "#000000",
              "on-tertiary-fixed": "#271901"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body { font-family: 'Inter', sans-serif; }
      h1, h2, h3, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .ghost-border { border-bottom: 1px solid transparent; transition: border-color 0.2s; }
      .ghost-border:focus-within { border-bottom-color: #000000; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Header Navigation (Hidden Shell Logic: Brief Identity Only for Auth) -->
<header class="w-full top-0 left-0 bg-surface flex justify-between items-center px-6 md:px-16 py-6">
<div class="text-2xl font-bold tracking-tighter text-[#0F172A] font-headline">Nara Merchant</div>
<div class="hidden md:flex items-center gap-2 text-slate-500 font-label text-sm">
<span class="material-symbols-outlined text-sm">security</span>
            Secure Registration
        </div>
</header>
<main class="flex-grow flex items-center justify-center px-4 py-12 md:py-20">
<!-- Auth Card Container -->
<div class="w-full max-w-xl bg-surface-container-lowest rounded-xl p-8 md:p-12 shadow-[0px_20px_40px_rgba(15,23,42,0.06)]">
<!-- Header Section -->
<div class="mb-10 text-center">
<h1 class="text-3xl font-extrabold tracking-tight font-headline text-primary mb-3">Create your account</h1>
<p class="text-on-surface-variant body-md">Join thousands of Nigerian entrepreneurs growing their business with Nara.</p>
</div>
<form class="space-y-6">
<!-- Row: Names -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="first_name">First Name</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden">
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-on-surface placeholder:text-outline-variant" id="first_name" placeholder="Amina" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="last_name">Last Name</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden">
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-on-surface placeholder:text-outline-variant" id="last_name" placeholder="Okonkwo" type="text"/>
</div>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="email">Email Address</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden">
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-on-surface placeholder:text-outline-variant" id="email" placeholder="amina@merchant.ng" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="phone">Phone Number</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden flex items-center">
<span class="pl-4 text-on-surface-variant font-medium">+234</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-2 text-on-surface placeholder:text-outline-variant" id="phone" placeholder="803 000 0000" type="tel"/>
</div>
</div>
<!-- Passwords -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="password">Password</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden">
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-on-surface placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant font-label" for="confirm_password">Confirm Password</label>
<div class="bg-surface-container-low rounded-lg ghost-border overflow-hidden">
<input class="w-full bg-transparent border-none focus:ring-0 py-3 px-4 text-on-surface placeholder:text-outline-variant" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary/20" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-tight" for="terms">
                        I agree to the <a class="text-primary font-semibold hover:underline decoration-secondary underline-offset-4" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline decoration-secondary underline-offset-4" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary-container hover:bg-secondary text-on-primary font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex justify-center items-center gap-2" type="submit">
                    Register
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<!-- Login Link -->
<div class="text-center pt-4">
<p class="text-on-surface-variant body-md">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline decoration-secondary underline-offset-4 ml-1" href="#">Login</a>
</p>
</div>
</form>
</div>
</main>
<!-- Subtle Footer for Auth Pages -->
<footer class="flex flex-col md:flex-row justify-between items-center px-6 md:px-16 py-8 w-full mt-auto bg-surface border-t border-transparent text-slate-500 text-xs font-label uppercase tracking-widest">
<div class="mb-4 md:mb-0">© 2024 Nara Merchant. Built for Nigerian Entrepreneurs.</div>
<div class="flex gap-6">
<a class="hover:text-primary transition-colors" href="#">Support</a>
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
</div>
</footer>
<!-- Background Decoration for Digital Atelier feel -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-secondary-fixed opacity-10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-fixed-dim opacity-5 rounded-full blur-[100px]"></div>
</div>
</body></html>
